spring.application.name=freshmart-pos-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:freshmart_pos}
spring.datasource.username=${DB_USERNAME:freshmart}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Base64-encoded key containing at least 32 random bytes. Never commit a real key.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-issuer=freshmart-pos
app.security.jwt-audience=freshmart-web
app.security.jwt-ttl=${JWT_TTL:PT1H}
app.security.secure-cookies=${AUTH_COOKIE_SECURE:true}
app.security.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:4173}

server.error.include-message=never
server.error.include-stacktrace=never

# Percentage applied after an order discount. The POS reads this from the API.
app.checkout.tax-rate=${CHECKOUT_TAX_RATE:0}
